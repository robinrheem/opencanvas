[project]
name = "opencanvas"
version = "0.1.0"
description = "CANVAS reproduction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers>=0.37.1",
    "diskcache>=5.6.3",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "pydantic-ai>=1.86.1",
    "pydantic-settings>=2.14.0",
    "torch>=2.11.0",
    "transformers>=5.6.2",
    "typer>=0.24.2",
]

[project.scripts]
opencanvas = "opencanvas.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencanvas"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
]
